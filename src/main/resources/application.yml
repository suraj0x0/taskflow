server:
  port: 8080

spring:
  application:
    name: taskflow
  datasource:
    url: ${TASKFLOW_DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${TASKFLOW_DB_USERNAME:taskflow}
    password: ${TASKFLOW_DB_PASSWORD:taskflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

taskflow:
  jwt:
    # Local-development fallback only. The prod profile requires TASKFLOW_JWT_SECRET.
    secret: ${TASKFLOW_JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS10YXNrZmxvdy1qd3Qtc2VjcmV0LWtleS0zMmJ5dGVz}
    expiration-ms: ${TASKFLOW_JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
