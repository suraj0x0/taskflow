server:
  port: 8080

spring:
  application:
    name: taskflow
  datasource:
    url: ${TASKFLOW_DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${TASKFLOW_DB_USERNAME:taskflow}
    password: ${TASKFLOW_DB_PASSWORD:taskflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
