server:
  port: 8080

spring:
  application:
    name: taskflow
  datasource:
    url: ${TASKFLOW_DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${TASKFLOW_DB_USERNAME:taskflow}
    password: ${TASKFLOW_DB_PASSWORD:taskflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

taskflow:
  jwt:
    # Development-only fallback; set TASKFLOW_JWT_SECRET in production.
    secret: ${TASKFLOW_JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS10YXNrZmxvdy1qd3Qtc2VjcmV0LWtleS0zMmJ5dGVz}
    expiration-ms: ${TASKFLOW_JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
